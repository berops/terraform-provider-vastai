package: vastai
output: client.gen.go

generate:
  client: true
  models: true

output-options:
  # Corrections to the upstream spec, kept out of openapi.yaml so that document
  # stays a pristine copy of what Vast.ai publishes and can be re-vendored freely.
  overlay:
    path: openapi-overlay.yaml

  include-operation-ids:
    - showSshKeys
    - getSshKeysUser
    - createSshKey
    - deleteSshKey
    - updateSshKey
    - createInstance
    - destroyInstance
    - showInstance
    - manageInstance
    - searchOffers

  skip-prune: false
  nullable-type: true
  name-normalizer: ToCamelCaseWithInitialisms
  client-type-name: VastAiClient

compatibility:
  always-prefix-enum-values: true
