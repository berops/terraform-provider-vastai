# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
    paths-ignore:
      - "README.md"
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      # We need the latest version of Terraform for our documentation generation to use
      - uses: hashicorp/setup-terraform@v4
      - run: make generate
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'make generate' command and commit."; exit 1)

  acceptance-test:
    name: Acceptance Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The tests rent real instances on shared accounts, and the sweeper below
    # destroys every tf-acc-* instance, so never run two of these at once.
    concurrency:
      group: vastai-acceptance-tests
      cancel-in-progress: false
    # Only run when secrets are available (not on fork PRs)
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    env:
      VASTAI_PERSONAL_API_KEY: ${{ secrets.VASTAI_PERSONAL_API_KEY }}
      VASTAI_TEAM_API_KEY: ${{ secrets.VASTAI_TEAM_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: true
      # Pin the Terraform CLI the test framework drives instead of letting it
      # download one at run time.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - run: go mod download
      - name: Run acceptance tests
        if: env.VASTAI_PERSONAL_API_KEY != '' && env.VASTAI_TEAM_API_KEY != ''
        env:
          TF_ACC: "1"
        run: go test -v -cover -timeout=20m -run "^TestAcc" ./internal/provider/
      - name: Sweep leftover instances
        if: always() && env.VASTAI_PERSONAL_API_KEY != '' && env.VASTAI_TEAM_API_KEY != ''
        timeout-minutes: 7
        run: go test -v -sweep=all ./internal/provider/
